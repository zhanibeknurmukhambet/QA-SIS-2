name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Playwright Tests (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      CI: true
      BASE_URL: http://127.0.0.1:4200

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Download Docker Compose configuration
        run: |
          curl -fsSL https://raw.githubusercontent.com/testsmith-io/practice-software-testing/9e7736c/docker-compose.prod.yml -o docker-compose.prod.yml
          printf "SPRINT=sprint5\nDISABLE_LOGGING=true\n" > .env

          cat > docker-compose.ci.yml <<'EOF'
          services:
            web:
              platform: linux/arm64
            cron:
              platform: linux/arm64
          EOF

      - name: Start application
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml up --pull missing -d
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml ps

      - name: Wait for database
        run: |
          READY=false

          for i in {1..24}; do
            if docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml exec -T mariadb mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              READY=true
              break
            fi

            echo "Waiting for MariaDB... ($i/24)"
            sleep 5
          done

          if [ "$READY" != "true" ]; then
            echo "MariaDB did not become ready."
            docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs mariadb
            exit 1
          fi

      - name: Seed database
        run: |
          SEEDED=false

          for i in {1..12}; do
            if docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml exec -T laravel-api php artisan migrate:fresh --seed; then
              SEEDED=true
              break
            fi

            echo "Database initialization failed. Retrying in 5 seconds... ($i/12)"
            sleep 5
          done

          if [ "$SEEDED" != "true" ]; then
            echo "Database seeding failed."
            docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs laravel-api
            exit 1
          fi

      - name: Wait for application
        run: |
          API_READY=false
          UI_READY=false

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8091/api/documentation -o /dev/null; then
              API_READY=true
              echo "API is ready."
              break
            fi

            echo "Waiting for API... ($i/60)"
            sleep 5
          done

          for i in {1..60}; do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4200)" = "200" ]; then
              UI_READY=true
              echo "Frontend is ready."
              break
            fi

            echo "Waiting for frontend... ($i/60)"
            sleep 5
          done

          if [ "$API_READY" != "true" ] || [ "$UI_READY" != "true" ]; then
            echo "Application did not become ready."
            docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs --tail=100
            exit 1
          fi

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload test results and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Show application logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs --tail=150

      - name: Stop application
        if: always()
        run: |
          if [ -f docker-compose.prod.yml ]; then
            docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml down --volumes --remove-orphans
          fi

  merge-reports:
    name: Merge Playwright Reports
    if: always()
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: |
          if find all-blob-reports -name '*.zip' -print -quit | grep -q .; then
            npx playwright merge-reports --reporter html ./all-blob-reports
          else
            echo "No blob reports were generated."
          fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn